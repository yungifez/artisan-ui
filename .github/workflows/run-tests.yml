name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-assets:
    name: Build package assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build JavaScript and CSS assets
        run: npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: package-assets
          path: dist
          if-no-files-found: error

  test:
    needs: build-assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Keep the Windows runner pinned while windows-latest moves between
        # server images with different PHP extension support.
        os: [ubuntu-latest, windows-2022]
        php: [8.4, 8.3]
        laravel: [12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
            carbon: '>=3.8.4 <4.0'
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: package-assets
          path: dist

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: php vendor/bin/pest --ci --no-coverage

  publish-assets:
    name: Publish built assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-assets, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: package-assets
          path: dist

      - name: Commit and push generated assets
        run: |
          if git diff --quiet -- dist ':(exclude)dist/manifest.json'; then
            if git show HEAD:dist/manifest.json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))" >/dev/null 2>&1; then
              git restore -- dist/manifest.json
              echo "No generated asset changes to publish."
              exit 0
            fi

            echo "The committed asset manifest is invalid; publishing the generated manifest."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build package assets [skip ci]"
          git push origin HEAD:main
